<nav class="navbar">
  <div class="navbar-brand">
    <div class="logo">
      <img src="assets/images/logo.png" class="logo-icon" />
    </div>
  </div>

  <div class="navbar-nav">
    @for (link of navLinks(); track link.path) {
      <a
        [routerLink]="link.path"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >
        {{ link.label }}
      </a>
    }
  </div>

  <div class="navbar-actions">
    <button class="icon-btn">
      <img src="assets/images/notification.png" class="icon" />
    </button>

    <div class="user-menu" (click)="$event.stopPropagation()">
     <button class="icon-btn user-btn" type="button" (click)="toggleUserMenu($event)">
         <img src="assets/images/user.png" class="icon" />
       </button>

    @if (userMenuOpen()) {
        <div class="user-dropdown">
          <a routerLink="/profile" (click)="profile()">Profile</a>
          <button type="button" (click)="logout()">Logout</button>
        </div>
      }
    </div>
  </div>
</nav>
